# docker compose up -d  → web on :3000, background collector, Postgres
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: egp, POSTGRES_DB: egpradar }
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "postgres://postgres:egp@db:5432/egpradar" }
    ports: ["3000:3000"]
    depends_on: [db]
  worker:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "postgres://postgres:egp@db:5432/egpradar" }
    command: sh -c "npm run import:history && npm run backtest && npm run worker"
    depends_on: [db]
    restart: unless-stopped
volumes: { pgdata: {} }
